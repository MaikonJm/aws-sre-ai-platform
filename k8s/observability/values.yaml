# kube-prometheus-stack sized for a single 4 GB k3s node.

# k3s runs these components inside the k3s binary; their endpoints are
# not scrapeable the standard way, so the default monitors are disabled.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false

prometheus:
  prometheusSpec:
    retention: 12h
    scrapeInterval: 15s
    # Pick up PodMonitors and rules from every namespace, not only Helm-labelled ones
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 100m
        memory: 400Mi
      limits:
        memory: 900Mi

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi
  config:
    route:
      receiver: "null"
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: "null"
          matchers: ['alertname = "Watchdog"']
        # SLO and application alerts go to the AI SRE agent (phase 4)
        - receiver: sre-agent
          matchers: ['severity =~ "page|ticket"', 'namespace = "orders"']
    receivers:
      - name: "null"
      - name: sre-agent
        webhook_configs:
          - url: http://sre-agent.sre-agent.svc:8080/alertmanager
            send_resolved: false

grafana:
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  ingress:
    enabled: true
    ingressClassName: traefik
    path: /grafana
    hosts: []
  grafana.ini:
    server:
      root_url: "%(protocol)s://%(domain)s/grafana"
      serve_from_sub_path: true
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
