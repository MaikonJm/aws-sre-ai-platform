apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: orders-slos
  namespace: orders
spec:
  groups:
    - name: orders-sli-recordings
      interval: 30s
      rules:
      - record: orders_api:error_ratio:rate5m
        expr: |
          (
            sum(rate(http_request_duration_seconds_count{namespace="orders",route=~"/orders.*",status=~"5.."}[5m]))
            or vector(0)  # no 5xx series yet means zero errors, not "no data"
          )
          /
          sum(rate(http_request_duration_seconds_count{namespace="orders",route=~"/orders.*"}[5m]))
      - record: orders_api:slow_ratio:rate5m
        expr: |
          1 - (
            sum(rate(http_request_duration_seconds_bucket{namespace="orders",route=~"/orders.*",le="0.25"}[5m]))
            /
            sum(rate(http_request_duration_seconds_count{namespace="orders",route=~"/orders.*"}[5m]))
          )
      - record: orders_api:error_ratio:rate30m
        expr: |
          (
            sum(rate(http_request_duration_seconds_count{namespace="orders",route=~"/orders.*",status=~"5.."}[30m]))
            or vector(0)  # no 5xx series yet means zero errors, not "no data"
          )
          /
          sum(rate(http_request_duration_seconds_count{namespace="orders",route=~"/orders.*"}[30m]))
      - record: orders_api:slow_ratio:rate30m
        expr: |
          1 - (
            sum(rate(http_request_duration_seconds_bucket{namespace="orders",route=~"/orders.*",le="0.25"}[30m]))
            /
            sum(rate(http_request_duration_seconds_count{namespace="orders",route=~"/orders.*"}[30m]))
          )
      - record: orders_api:error_ratio:rate1h
        expr: |
          (
            sum(rate(http_request_duration_seconds_count{namespace="orders",route=~"/orders.*",status=~"5.."}[1h]))
            or vector(0)  # no 5xx series yet means zero errors, not "no data"
          )
          /
          sum(rate(http_request_duration_seconds_count{namespace="orders",route=~"/orders.*"}[1h]))
      - record: orders_api:slow_ratio:rate1h
        expr: |
          1 - (
            sum(rate(http_request_duration_seconds_bucket{namespace="orders",route=~"/orders.*",le="0.25"}[1h]))
            /
            sum(rate(http_request_duration_seconds_count{namespace="orders",route=~"/orders.*"}[1h]))
          )
      - record: orders_api:error_ratio:rate6h
        expr: |
          (
            sum(rate(http_request_duration_seconds_count{namespace="orders",route=~"/orders.*",status=~"5.."}[6h]))
            or vector(0)  # no 5xx series yet means zero errors, not "no data"
          )
          /
          sum(rate(http_request_duration_seconds_count{namespace="orders",route=~"/orders.*"}[6h]))
      - record: orders_api:slow_ratio:rate6h
        expr: |
          1 - (
            sum(rate(http_request_duration_seconds_bucket{namespace="orders",route=~"/orders.*",le="0.25"}[6h]))
            /
            sum(rate(http_request_duration_seconds_count{namespace="orders",route=~"/orders.*"}[6h]))
          )
    - name: orders-slo-alerts
      rules:
      - alert: OrdersApiAvailabilityFastBurn
        expr: |
          orders_api:error_ratio:rate1h > (14.4 * 0.005)
          and
          orders_api:error_ratio:rate5m > (14.4 * 0.005)
        labels:
          severity: page
          namespace: orders  # sum() drops labels; the Alertmanager route needs this
          slo: availability
        annotations:
          summary: "Orders API is failing requests fast enough to exhaust the 99.5% availability budget in ~2 days"
          description: "Burning the error budget 14.4x faster than sustainable (1h and 5m windows)."
      - alert: OrdersApiAvailabilitySlowBurn
        expr: |
          orders_api:error_ratio:rate6h > (6 * 0.005)
          and
          orders_api:error_ratio:rate30m > (6 * 0.005)
        labels:
          severity: ticket
          namespace: orders  # sum() drops labels; the Alertmanager route needs this
          slo: availability
        annotations:
          summary: "Orders API is steadily consuming the availability error budget"
          description: "Burning the error budget 6x faster than sustainable (6h and 30m windows)."
      - alert: OrdersApiLatencyFastBurn
        expr: |
          orders_api:slow_ratio:rate1h > (14.4 * 0.01)
          and
          orders_api:slow_ratio:rate5m > (14.4 * 0.01)
        labels:
          severity: page
          namespace: orders  # sum() drops labels; the Alertmanager route needs this
          slo: latency
        annotations:
          summary: "Too many Orders API requests are slower than 250 ms"
          description: "Burning the error budget 14.4x faster than sustainable (1h and 5m windows)."
      - alert: OrdersApiLatencySlowBurn
        expr: |
          orders_api:slow_ratio:rate6h > (6 * 0.01)
          and
          orders_api:slow_ratio:rate30m > (6 * 0.01)
        labels:
          severity: ticket
          namespace: orders  # sum() drops labels; the Alertmanager route needs this
          slo: latency
        annotations:
          summary: "Orders API latency is steadily consuming the latency error budget"
          description: "Burning the error budget 6x faster than sustainable (6h and 30m windows)."
      - alert: OrdersWorkerFailing
        expr: sum(rate(orders_failed_total{namespace="orders"}[5m])) > 0
        for: 2m
        labels:
          severity: ticket
          namespace: orders  # sum() drops labels; the Alertmanager route needs this
        annotations:
          summary: "The worker is failing to process orders"
          description: "Failed messages are retried and moved to the DLQ after 3 attempts."
      - alert: OrdersBacklogGrowing
        expr: |
          sum(increase(orders_created_total{namespace="orders"}[10m]))
          - (
            sum(increase(orders_processed_total{namespace="orders"}[10m]))
            or vector(0)  # worker gone = nothing processed, not "no data"
          ) > 20
        for: 5m
        labels:
          severity: page
          namespace: orders  # sum() drops labels; the Alertmanager route needs this
        annotations:
          summary: "Orders are being created faster than they are processed"
          description: "The worker may be down or stuck; orders are piling up in SQS."
      # Found in the second test: with the worker scaled to 0 its metrics
      # disappear, and a rule built only on them went quiet ~10 minutes into
      # the outage. This one reads the deployment state instead.
      - alert: OrdersWorkerUnavailable
        expr: |
          max(kube_deployment_status_replicas_available{namespace="orders",deployment="worker"}) < 1
        for: 3m
        labels:
          severity: page
          namespace: orders
        annotations:
          summary: "No worker replica is available: orders are not being processed"
          description: "The worker deployment has no available replicas (scaled to 0, crashing or not scheduled)."
