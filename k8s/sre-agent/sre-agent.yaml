apiVersion: v1
kind: Namespace
metadata:
  name: sre-agent
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sre-agent
  namespace: sre-agent
---
# Read-only access to the application namespace. The agent cannot change anything.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sre-agent-read
  namespace: orders
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "services"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sre-agent-read
  namespace: orders
subjects:
  - kind: ServiceAccount
    name: sre-agent
    namespace: sre-agent
roleRef:
  kind: Role
  name: sre-agent-read
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-agent
  namespace: sre-agent
  labels:
    app: sre-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sre-agent
  template:
    metadata:
      labels:
        app: sre-agent
    spec:
      serviceAccountName: sre-agent
      imagePullSecrets:
        - name: ecr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: sre-agent
          image: sre-agent # replaced by kustomize with the ECR image
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: sre-agent-config
          env:
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sre-agent-github
                  key: token
                  optional: true # without a token, reports stay in logs and GET /reports
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: sre-agent
  namespace: sre-agent
spec:
  selector:
    app: sre-agent
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: sre-agent
  namespace: sre-agent
spec:
  selector:
    matchLabels:
      app: sre-agent
  podMetricsEndpoints:
    - port: http
      path: /metrics
